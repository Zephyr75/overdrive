# The breakout scene, written by hand in the Blender add-on's format: positions
# in Blender's z-up axes, angles in degrees. The game places everything marked
# movable itself, so those sit at the origin here

[camera]
name = "Camera"
type = "persp"
position = [0.0, -3.4, 3.3]
front = [0.0, 0.750726, -0.660617]
up = [0.0, 0.660617, 0.750726]
fov = 45.0

[environment]
file = "cedar_bridge_sunset_1_4k.hdr"
# Above 1 so the polished bricks have a sky bright enough to mirror
strength = 1.5

[[mesh]]
name = "Floor"
obj = "Floor.obj"
mtl = "Floor.mtl"
# Only receives: the floor shadows nothing a camera above it can see
castsShadow = false

[[mesh]]
name = "WallLeft"
obj = "WallLeft.obj"
mtl = "Wall.mtl"

[[mesh]]
name = "WallRight"
obj = "WallRight.obj"
mtl = "Wall.mtl"

[[mesh]]
name = "WallBack"
obj = "WallBack.obj"
mtl = "Wall.mtl"

# Where the showcase exported it, which is where its OBJ's vertices are
[[mesh]]
name = "Ball"
position = [-0.21679, 0.117582, 0.353544]
obj = "Football.obj"
mtl = "Football.mtl"
movable = true

[[mesh]]
name = "Paddle"
obj = "Paddle.obj"
mtl = "Paddle.mtl"
movable = true

# Six to a row, back row first; the game lays them out in this order

