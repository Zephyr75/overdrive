# Vulkan 1.3, 4x MSAA — the default settings file
#
#   go run .                               # this file
#   go run . -config configs/vulkan.toml   # the same, named
#
# Copy it to try other settings; every key is optional, and an absent one keeps
# the default in settings/settings.go.
# This file is the engine's only configuration input — nothing in the
# environment overrides it.

[window]
width = 1920
height = 1080

[shadows]
width = 1024
height = 1024

[renderer]
backend = "vulkan"

[antialiasing]
mode = "msaa"
samples = 4
