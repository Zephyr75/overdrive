# Low tier for integrated GPUs: go run . -config configs/low.toml
# Same code and light budget as the default, only cheaper values

[window]
width = 1920
height = 1080

[renderer]
backend = "vulkan"

[shadows]
# Half the side of the default: every shadow half as sharp, same slot count
atlasSize = 2048
slotDivisors = [2, 8, 16, 32]
slotCounts = [1, 16, 64, 256]
tierScores = [0.50, 0.20, 0.08]

# No moving shadows, so no per-frame shadow work
dynamicAtlas = false
bakeBudgetMiB = 0

pcf = "cheap"
nearPlane = 1.0
farPlane = 50.0

[antialiasing]
mode = "none"
samples = 1

[textures]
anisotropy = 1

[debug]
validation = false
lockCamera = false
noShadows = false
noPrepass = false
