# Low tier for integrated GPUs: go run . -config configs/low.toml
# Same code and light budget as the default, only cheaper values

[window]
width = 1920
height = 1080

[renderer]
backend = "vulkan"

[shadows]
# Half the side of the default: every shadow half as sharp, same slot count
atlasSize = 2048
slotDivisors = [2, 8, 16, 32]
slotCounts = [1, 16, 64, 256]
tierScores = [0.50, 0.20, 0.08]

# No moving shadows, so no per-frame shadow work
dynamicAtlas = false
bakeBudgetMegatexels = 0

pcf = "cheap"
nearPlane = 1.0
farPlane = 50.0
sunHalfExtent = 10.0

[antialiasing]
mode = "none"
samples = 1

[ambientOcclusion]
# Off: a full-screen pass and a 16-tap blur the low tier does not afford
enabled = false
radius = 0.25         # metres sampled around each pixel
intensity = 1.5       # exponent on the result: above 1 is darker

[textures]
anisotropy = 1

[debug]
validation = false
lockCamera = false
noShadows = false
noPrepass = false
