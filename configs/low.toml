# go run . -config configs/low.toml
#
# The low tier: one code path, one scene, an integrated GPU. Everything here is
# a value the default file also has — there is no separate low-end code, which is
# the whole point of the quality tiers.
#
# What it gives up, in order of what it buys back:
#   - the dynamic shadow atlas, so a moving object casts no shadow at all
#   - three quarters of the shadow texels, so every tile is half as sharp
#   - the 3x3 PCF refinement, so a penumbra quantises to quarters
#   - MSAA and anisotropy
# The light budget is untouched: the same 337 slots, so the same number of
# lights still cast.

[window]
width = 1280
height = 720

[renderer]
backend = "vulkan"
# Kept on: the prepass costs one cheap geometry pass and saves the light loop on
# every overdrawn fragment, which is the trade an integrated GPU wants most
depthPrepass = true

[shadows]
# A quarter of the texels of the default. The slot rows below are unchanged, so
# the layout rescales rather than losing slots: same light budget, half the
# resolution each. forward.slang's normal-offset bias scales with this
atlasSize = 2048
slotDivisors = [2, 8, 16, 32]
slotCounts = [1, 16, 64, 256]
tierScores = [0.50, 0.20, 0.08]

# The low-end switch. No second atlas, no per-frame copy, no per-frame bake
dynamicAtlas = false
bakeBudgetMiB = 0

pcf = "cheap"
nearPlane = 1.0
farPlane = 50.0

[antialiasing]
mode = "none"
samples = 1

[textures]
anisotropy = 1

[debug]
validation = false
lockCamera = false
noShadows = false
