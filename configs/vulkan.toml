# go run . -config configs/vulkan.toml
#
# Every key is optional and an absent one keeps its default, but an unknown key
# or an out-of-range value is an error rather than a shrug: a settings file that
# is silently ignored is worse than one that fails.

[window]
width = 1920
height = 1080

# The shadow atlas, and what it is carved into. Two orthogonal knobs: atlasSize
# buys sharpness, the slot counts buy light budget — every slot size is a
# division of the atlas, so turning shadows down must not stop lights casting
[shadows]
# Side of the one atlas, in texels. A power of two, 1024 to 8192
atlasSize = 4096

# The slot layout, as parallel arrays: row i holds slotCounts[i] slots of
# atlasSize / slotDivisors[i]. Divisors ascend, so the rows run largest first.
# The default is LIGHTING_PLAN.md 4.1's partition: 1x2048 + 16x512 + 64x256 +
# 256x128 = 337 slots and 100% of a 4096 atlas
slotDivisors = [2, 8, 16, 32]
slotCounts = [1, 16, 64, 256]

# The score (light radius / distance to camera) at which a light earns each row
# after the first, descending. One per non-sun row; below the last a light casts
# no shadow at all. This is the ceiling on what a light may hold, not what it
# gets: rank picks the slot and this caps it
tierScores = [0.50, 0.20, 0.08]

# Build the second atlas, so a moving object casts a moving shadow. false is the
# low-end switch: every record falls back to the static atlas, movers cast
# nothing, and the per-frame shadow cost goes to zero
dynamicAtlas = true

# Texels, in MiB, a frame may spend rebuilding dynamic tiles. What does not fit
# waits, ranked by score, and keeps the tile it already has meanwhile
bakeBudgetMiB = 8

# Taps per shadow lookup: "full" is 4 corners then a 3x3 where they disagree,
# "cheap" is the 4 corners alone
pcf = "full"

# The near and far planes every shadow projection is built with
nearPlane = 1.0
farPlane = 50.0

[renderer]
backend = "vulkan"

# Draw depth first, then shade only the fragments that survive, with an EQUAL
# depth test. Turn off to compare the image: the two passes must agree to the
# bit, and a disagreement shows as speckle along edges rather than as an error
depthPrepass = true

[antialiasing]
mode = "msaa"         # or "none"
samples = 4           # 1, 2, 4 or 8

[textures]
anisotropy = 8        # 1 (off), 2, 4, 8 or 16

# Inspection switches. These change how a run is looked at, not what it renders
# — except noShadows, which is deliberately an A/B.
[debug]
# Vulkan validation layers. Costs frame rate, reports API misuse
validation = false

# Freeze the camera where the scene put it: no mouse look, no WASD. A
# reproducible RenderDoc capture needs it — with the cursor captured, the
# compositor delivers a position event of its own choosing on the first frames
# and the view drifts every run
lockCamera = false

# Light every light unshadowed while still baking every tile. The A/B that
# separates "the scene is dark" from "every light is wrongly occluded", two
# failures that render identically and share no code
noShadows = false
