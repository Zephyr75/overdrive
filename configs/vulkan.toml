# Default settings: go run . -config configs/vulkan.toml

[window]
width = 1920
height = 1080

[renderer]
backend = "vulkan"

[shadows]
# Atlas side in texels, a power of two from 1024 to 8192: bigger is sharper
atlasSize = 4096

# slotCounts[i] slots of atlasSize / slotDivisors[i] each, largest first
slotDivisors = [2, 8, 16, 32]
slotCounts = [1, 16, 64, 256]

# Score (radius / distance) a light needs for each smaller slot size; below the last, no shadow
tierScores = [0.50, 0.20, 0.08]

# Second atlas for moving objects' shadows; false means movers cast none
dynamicAtlas = true

# Dynamic shadow texels re-baked per frame, in units of 2^20
bakeBudgetMiB = 8

# Shadow edge softening: "full" (up to 9 taps) or "cheap" (4 taps)
pcf = "full"

# Near and far planes of every shadow projection
nearPlane = 1.0
farPlane = 50.0

[antialiasing]
mode = "msaa"         # or "none"
samples = 4           # 1, 2, 4 or 8

[textures]
anisotropy = 8        # 1 (off), 2, 4, 8 or 16

[debug]
# Vulkan validation layers: reports API misuse, costs frame rate
validation = false

# Freeze the camera so two runs or captures match
lockCamera = false

# Render every light unshadowed, to tell "too dark" apart from "wrongly shadowed"
noShadows = false

# Skip the depth prepass, to check it renders the same as plain depth testing
noPrepass = false
